<div class="paginacion">
  <span class="resumen">Mostrando {{ desde }}–{{ hasta }} de {{ total }}</span>
  <nav *ngIf="totalPaginas > 1" aria-label="Paginación">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="pagina === 1">
        <button type="button" class="page-link" aria-label="Página anterior" (click)="irA(pagina - 1)">
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>
      </li>
      <li *ngFor="let numero of paginas" class="page-item" [class.active]="numero === pagina">
        <button type="button" class="page-link" [attr.aria-current]="numero === pagina ? 'page' : null" (click)="irA(numero)">
          {{ numero }}
        </button>
      </li>
      <li class="page-item" [class.disabled]="pagina === totalPaginas">
        <button type="button" class="page-link" aria-label="Página siguiente" (click)="irA(pagina + 1)">
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
