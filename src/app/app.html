<div class="app-layout" [class.menu-compacto]="menuCompacto">
  <aside class="sidebar" id="menu-lateral">
    <div class="brand">
      <i class="bi bi-plus-square" aria-hidden="true"></i>
      <strong>Veterinaria</strong>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal">
      <a routerLink="/duenos" routerLinkActive="active" ariaCurrentWhenActive="page" class="sidebar-link" aria-label="Dueños" title="Dueños">
        <i class="bi bi-people" aria-hidden="true"></i>
        <span>Dueños</span>
      </a>
      <a routerLink="/mascotas" routerLinkActive="active" ariaCurrentWhenActive="page" class="sidebar-link" aria-label="Mascotas" title="Mascotas">
        <i class="bi bi-heart" aria-hidden="true"></i>
        <span>Mascotas</span>
      </a>
      <a routerLink="/citas" routerLinkActive="active" ariaCurrentWhenActive="page" class="sidebar-link" aria-label="Citas" title="Citas">
        <i class="bi bi-calendar3" aria-hidden="true"></i>
        <span>Citas</span>
      </a>
      <a routerLink="/historial" routerLinkActive="active" ariaCurrentWhenActive="page" class="sidebar-link" aria-label="Historial" title="Historial">
        <i class="bi bi-journal-medical" aria-hidden="true"></i><span>Historial</span>
      </a>
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-start">
        <button type="button" class="menu-toggle" (click)="menuCompacto = !menuCompacto" aria-controls="menu-lateral" [attr.aria-expanded]="!menuCompacto" [attr.aria-label]="menuCompacto ? 'Ampliar menú' : 'Reducir menú'">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <span class="breadcrumb-label">Clínica <i class="bi bi-chevron-right" aria-hidden="true"></i> <strong>{{ paginaActual }}</strong></span>
      </div>
      <i class="bi bi-plus-square clinic-mark" aria-hidden="true"></i>
    </header>
    <main id="contenido"><router-outlet /></main>
  </div>
</div>
